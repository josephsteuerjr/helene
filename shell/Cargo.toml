[package]
name = "vera"
version = "0.1.0"
edition = "2021"
description = "Frame — нативная оболочка основной программы: окно + WebView2, трей, уведомления, один экземпляр. Говорит с харнессом агента по frame.desk.v1: локально (дети окна) или удалённо."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
ureq = { version = "2", features = ["tls"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
tauri-winrt-notification = "0.7"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
opt-level = "z"
lto = true
strip = true

# Без этой фичи Tauri считает сборку «dev» и грузит devUrl (localhost) вместо
# вшитой страницы. `tauri build` включает её сам; при `cargo build` — руками:
# cargo build --release --features custom-protocol
[features]
custom-protocol = ["tauri/custom-protocol"]
