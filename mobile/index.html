<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fdfcfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1815" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Агент" />
    <link rel="apple-touch-icon" href="/m/apple-touch-icon.png" />
    <title>Агент</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <header id="top">
        <div class="top-name" id="top-name">Агент</div>
        <div class="top-state" id="top-state"><span class="state-dot"></span><span id="top-phrase">Подключение…</span></div>
      </header>
      <div id="rooms" class="rooms"></div>
      <section id="feed" class="feed"></section>
      <div id="notice" class="notice" hidden></div>
      <footer id="composer" class="composer">
        <textarea id="say" rows="1" placeholder="Сообщение…" enterkeyhint="send"></textarea>
        <button id="send" class="send" type="button" aria-label="Отправить">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 15.5v-11M5.8 8.7 10 4.5l4.2 4.2" /></svg>
        </button>
      </footer>
    </div>
    <div id="pair" class="pair" hidden></div>
  </body>
</html>
